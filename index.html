<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#2A211C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zonk">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Zonk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>html,body{height:100%;margin:0;background:#2A211C}</style>
</head>
<body>
<!-- This file never changes. The game lives in app.js, fetched with a
     timestamp so every visit gets the newest build with no cache tricks. -->
<script type="module">
  import("./app.js?t=" + Date.now()).catch(err => {
    document.body.innerHTML =
      "<p style='color:#F2EDE4;font:16px system-ui;padding:24px'>" +
      "Couldn't load the game. Check your connection and reload.<br><br>" + err + "</p>";
  });
</script>
</body>
</html>
